[project]
name = "locus-mcp"
version = "0.10.0"
description = "Hierarchical markdown memory palace for AI agents — MCP server, skills, and audit tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["mcp", "memory", "agents", "llm", "claude", "palace", "context-window"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "claude-agent-sdk>=0.0.14",
    "anyio>=4.0",
    "mcp>=1.26.0",
    "uvicorn>=0.30",
    "cryptography>=41.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Nano-Nimbus/locus"
Documentation = "https://github.com/Nano-Nimbus/locus/wiki"
Repository = "https://github.com/Nano-Nimbus/locus"
"Bug Tracker" = "https://github.com/Nano-Nimbus/locus/issues"
Changelog = "https://github.com/Nano-Nimbus/locus/blob/main/CHANGELOG.md"

[project.scripts]
locus = "locus.cli:main"
locus-audit = "locus.audit.main:cli"
locus-mcp = "locus.mcp.main:cli"
locus-security = "locus.security.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["locus"]

# The palace and configuration templates are data the installed CLI reads
# (locus init, locus-security init-config), so they have to be inside the
# wheel. They stay at the repository root because CLAUDE.md, CONTRIBUTING.md
# and the skills all cite those paths as the canonical structural reference;
# force-include puts one copy of each under locus/_scaffold/ at build time.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "locus/_scaffold/templates"
"example-palace" = "locus/_scaffold/example-palace"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "matplotlib>=3.8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
